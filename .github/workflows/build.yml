{ orientation = LinearLayout.VERTICAL setBackgroundColor(BG) } val header = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL setPadding(24, 40, 24, 16) gravity = Gravity.CENTER_VERTICAL } val logo = TextView(this).apply { text = "D" setTextColor(TEXT) textSize = 20f gravity = Gravity.CENTER setBackgroundColor(ACCENT) width = 90; height = 90 } val titleCol = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL setPadding(20, 0, 0, 0) } val title = TextView(this).apply { text = "Damien TV 241" setTextColor(TEXT) textSize = 18f } val subtitle = TextView(this).apply { text = "PROTOTYPE NEYLA 241" setTextColor(GOLD) textSize = 10f } titleCol.addView(title); titleCol.addView(subtitle) header.addView(logo); header.addView(titleCol) root.addView(header) val presetScroll = HorizontalScrollView(this) val presetRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL setPadding(16, 8, 16, 8) } presets.forEach { (name, url) -> val btn = TextView(this).apply { text = name setTextColor(TEXT) textSize = 13f setPadding(28, 18, 28, 18) setBackgroundColor(CARD) setOnClickListener { loadPlaylist(url) } } val lp = LinearLayout.LayoutParams( LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT) lp.marginEnd = 12 presetRow.addView(btn, lp) } presetScroll.addView(presetRow) root.addView(presetScroll) val urlRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL setPadding(16, 8, 16, 8) gravity = Gravity.CENTER_VERTICAL } val urlInput = EditText(this).apply { setText(presets[0].second) setTextColor(TEXT) setHintTextColor(MUTED) hint = "URL M3U" textSize = 13f setBackgroundColor(CARD) setPadding(20, 20, 20, 20) } val urlLp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f) val loadBtn = TextView(this).apply { text = "Charger" setTextColor(TEXT) textSize = 13f setBackgroundColor(ACCENT) setPadding(30, 24, 30, 24) setOnClickListener { loadPlaylist(urlInput.text.toString()) } } val btnLp = LinearLayout.LayoutParams( LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT) btnLp.marginStart = 10 urlRow.addView(urlInput, urlLp) urlRow.addView(loadBtn, btnLp) root.addView(urlRow) val search = EditText(this).apply { setTextColor(TEXT) setHintTextColor(MUTED) hint = "Rechercher..." textSize = 13f setBackgroundColor(CARD) setPadding(20, 20, 20, 20) } val searchLp = LinearLayout.LayoutParams( LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT) searchLp.setMargins(16, 8, 16, 8) search.addTextChangedListener(object : TextWatcher { override fun afterTextChanged(s: Editable?) { filter(s.toString()) } override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {} override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {} }) root.addView(search, searchLp) val rv = RecyclerView(this).apply { layoutManager = LinearLayoutManager(this@MainActivity) } adapter = ChannelAdapter(channels) { ch -> val intent = Intent(this@MainActivity, PlayerActivity::class.java) intent.putExtra("url", ch.url) intent.putExtra("title", ch.name) startActivity(intent) } rv.adapter = adapter root.addView(rv, LinearLayout.LayoutParams( LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)) val credit = TextView(this).apply { text = "Concu par Damien (Starly Koumba)" setTextColor(MUTED) textSize = 11f gravity = Gravity.CENTER setPadding(0, 16, 0, 16) } root.addView(credit) setContentView(root) loadPlaylist(presets[0].second) } private fun loadPlaylist(url: String) { scope.launch { Toast.makeText(this@MainActivity, "Chargement...", Toast.LENGTH_SHORT).show() try { val ch = withContext(Dispatchers.IO) { fetchM3U(url) } allChannels = ch filter("") Toast.makeText(this@MainActivity, "${ch.size} chaines", Toast.LENGTH_SHORT).show() } catch (e: Exception) { Toast.makeText(this@MainActivity, "Erreur: ${e.message}", Toast.LENGTH_LONG).show() } } } private fun filter(query: String) { channels.clear() channels.addAll( if (query.isEmpty(