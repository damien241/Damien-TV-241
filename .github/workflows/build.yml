 = items[position] val row = holder.itemView as LinearLayout val logo = row.getChildAt(0) as ImageView val name = row.getChildAt(1) as TextView name.text = ch.name if (ch.logo.isNotEmpty()) { Glide.with(logo).load(ch.logo).into(logo) } else { logo.setImageResource(android.R.drawable.ic_menu_view) } row.setOnClickListener { onClick(ch) } } override fun getItemCount() = items.size } KOTLIN_END - name: PlayerActivity.kt run: | cat > app/src/main/java/com/damientv241/app/PlayerActivity.kt << 'KOTLIN_END' package com.damientv241.app import android.graphics.Color import android.os.Bundle import android.view.WindowManager import android.widget.FrameLayout import android.widget.TextView import androidx.appcompat.app.AppCompatActivity import androidx.media3.common.MediaItem import androidx.media3.exoplayer.ExoPlayer import androidx.media3.exoplayer.source.DefaultMediaSourceFactory import androidx.media3.datasource.okhttp.OkHttpDataSource import androidx.media3.ui.PlayerView import okhttp3.OkHttpClient class PlayerActivity : AppCompatActivity() { private var player: ExoPlayer? = null override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState) window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON) window.statusBarColor = Color.BLACK val url = intent.getStringExtra("url") ?: return val title = intent.getStringExtra("title") ?: "Lecture" val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) } val playerView = PlayerView(this).apply { layoutParams = FrameLayout.LayoutParams(-1, -1) setUseController(true) } root.addView(playerView) val titleView = TextView(this).apply { text = title setTextColor(Color.WHITE) textSize = 14f setPadding(30, 60, 30, 30) } root.addView(titleView) setContentView(root) val httpClient = OkHttpClient.Builder().build() val httpFactory = OkHttpDataSource.Factory(httpClient) .setUserAgent("VLC/3.0.20 LibVLC/3.0.20") player = ExoPlayer.Builder(this) .setMediaSourceFactory(DefaultMediaSourceFactory(httpFactory)) .build() playerView.player = player val item = MediaItem.fromUri(url) player!!.setMediaItem(item) player!!.prepare() player!!.playWhenReady = true } override fun onPause() { super.onPause() player?.pause() } override fun onDestroy() { super.onDestroy() player?.release() player = null } } KOTLIN_END - name: Compiler l'APK run: gradle assembleRelease --no-daemon - name: Renommer APK run: | mkdir -p output cp app/build/outputs/apk/release/app-release.apk output/damien-tv-241.apk - name: Envoyer uses: actions/upload-artifact@v4 with: name: damien-tv-241-apk path: output/damien-tv-241.apk
